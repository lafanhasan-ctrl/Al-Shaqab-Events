<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Al Shaqab — Events Master Calendar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* -- Official Al Shaqab Brand Colours --
   Primary:    Pantone 1955C  → RGB 144-25-56   (deep crimson)
   Secondary:  Pantone 871C   → RGB 133-117-78  (metallic gold)
               Pantone 877C   → RGB 140-143-144 (silver)
   Neutrals:   Pantone 404C   → RGB 204-200-194 (warm light grey)
               Warm Gray 11C  → RGB 142-128-118 (warm mid grey)
   Typefaces:  El Messiri (secondary, Google Fonts available)
               Inter (document/UI — substituting QF Typeface)
-- */
:root {
  /* Brand primaries */
  --crimson:       #901938;
  --crimson-dk:    #6E1229;
  --crimson-lt:    #A81E42;
  --gold:          #857549;
  --gold-lt:       #9A8A58;
  --gold-pale:     #F3EFE3;
  --silver:        #8C8F90;
  --silver-lt:     #CCCAC2;   /* Pantone 404C */
  --warm-grey:     #8E8076;   /* Warm Gray 11C */

  /* UI surface */
  --sand:          #F7F4EE;
  --off-white:     #FDFCFA;
  --white:         #FFFFFF;
  --border:        #E6E0D6;
  --border-dk:     #D4CCBF;

  /* Text */
  --ink:           #1C1A18;
  --ink-md:        #3D3830;
  --ink-lt:        #7A7060;

  /* Status colours */
  --confirmed:     #C4972A;
  --confirmed-bg:  #FEF9EC;
  --suggested:     #2563A8;
  --suggested-bg:  #EBF4FF;
  --complete:      #1F7A4A;
  --complete-bg:   #EDFAF3;
  --cancelled:     #B91C3B;
  --cancelled-bg:  #FFF0F3;
  --bump-color:    #8E8076;
  --bump-bg:       #F5F3F0;

  /* Layout */
  --sidebar-w:    226px;
  --topbar-h:     58px;
  --r:            7px;
  --shadow-sm:    0 1px 3px rgba(28,26,24,.07), 0 1px 2px rgba(28,26,24,.04);
  --shadow:       0 3px 10px rgba(28,26,24,.09);
  --shadow-lg:    0 8px 24px rgba(28,26,24,.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14.5px;
  color: var(--ink);
  background: var(--sand);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* -- Layout -- */
.app { display: flex; height: 100vh; overflow: hidden; }

/* -- Sidebar -- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--crimson);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 22px 18px 18px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.sidebar-wordmark {
  font-family: 'El Messiri', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-pale);
  letter-spacing: .01em;
  line-height: 1.1;
}
.sidebar-wordmark span {
  display: block;
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.45);
  margin-top: 4px;
  font-family: 'Inter', sans-serif;
}
.sidebar-nav { padding: 10px 10px; flex: 1; }
.sidebar-section {
  font-size: 9.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  padding: 14px 8px 5px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: var(--r);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.7);
  transition: background .12s, color .12s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-btn:hover { background: rgba(255,255,255,.09); color: #fff; }
.nav-btn.active { background: rgba(133,117,78,.25); color: var(--gold-pale); }
.nav-btn .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gold);
  margin-left: auto;
  opacity: 0;
  transition: opacity .12s;
}
.nav-btn.active .dot { opacity: 1; }

/* -- Main -- */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: var(--topbar-h);
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
.topbar-title {
  font-family: 'El Messiri', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  flex: 1;
}
.search-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--sand);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 6px 12px;
  cursor: pointer;
  width: 220px;
  transition: border-color .15s;
  color: var(--ink-lt);
  font-size: 12.5px;
}
.search-trigger:hover { border-color: var(--gold); }

/* -- Buttons -- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--r);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all .14s;
  white-space: nowrap;
  font-family: inherit;
}
.btn-primary { background: var(--crimson); color: #fff; }
.btn-primary:hover { background: var(--crimson-lt); }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: var(--gold-lt); }
.btn-secondary {
  background: var(--white);
  color: var(--ink-md);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--sand); border-color: var(--border-dk); }
.btn-ghost { background: none; color: var(--ink-lt); }
.btn-ghost:hover { background: var(--sand); color: var(--ink); }
.btn-danger { background: var(--cancelled); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* -- Content area -- */
.content { flex: 1; overflow-y: auto; padding: 20px; }

/* -- Cards -- */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

/* -- Dashboard -- */
.dash-stats { display: grid; grid-template-columns: repeat(5,1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 16px 16px 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.stat-accent { position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 2px 2px 0; }
.stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-lt); margin-bottom: 5px; }
.stat-value { font-family: 'El Messiri', serif; font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1; }
.stat-sub { font-size: 11.5px; color: var(--ink-lt); margin-top: 5px; }

.section-hd {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Event row - dashboard */
.ev-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.ev-row:last-child { border-bottom: none; }
.ev-row:hover .ev-name { color: var(--crimson); }
.ev-date-box {
  background: var(--sand);
  border: 1px solid var(--border);
  border-radius: 6px;
  min-width: 42px;
  text-align: center;
  padding: 4px 6px;
  flex-shrink: 0;
}
.ev-date-mon { font-size: 9.5px; text-transform: uppercase; color: var(--ink-lt); letter-spacing: .06em; }
.ev-date-day { font-family: 'El Messiri', serif; font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.ev-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.ev-meta { font-size: 11px; color: var(--ink-lt); margin-top: 2px; }

/* -- Calendar grid -- */
.cal-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.cal-nav-grp {
  display: flex;
  align-items: center;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.cal-nav-btn {
  width: 32px;
  height: 32px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--ink-md);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s;
}
.cal-nav-btn:hover { background: var(--sand); }
.cal-month-lbl {
  font-family: 'El Messiri', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  min-width: 164px;
  text-align: center;
  padding: 0 4px;
  cursor: pointer;
}
.month-pick-pop {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 6px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  padding: 12px;
  z-index: 300;
  width: 220px;
}
.month-pick-yr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-pick-yr-lbl { font-family: 'El Messiri', serif; font-weight: 700; font-size: 15px; color: var(--ink); }
.month-pick-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.month-pick-btn {
  padding: 7px 0;
  border: 1px solid var(--border);
  background: var(--white);
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-md);
  cursor: pointer;
  font-family: inherit;
  transition: all .12s;
}
.month-pick-btn:hover { background: var(--sand); border-color: var(--border-dk); }
.month-pick-btn.active { background: var(--crimson); color: #fff; border-color: var(--crimson);
}
.view-toggle {
  display: flex;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.vt-btn {
  padding: 6px 13px;
  border: none;
  background: none;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ink-lt);
  transition: all .13s;
  font-family: inherit;
}
.vt-btn.active { background: var(--crimson); color: #fff; }

/* Calendar grid itself */
.cal-outer { overflow-x: auto; width: 100%; }
.cal-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); min-width: 700px; width: 100%; }
.cal-head { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); background: var(--crimson); }
.cal-dn { padding: 9px 4px; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: rgba(255,255,255,.75); }
.cal-body { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); }
.cal-cell {
  min-height: 120px;
  height: auto;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 4px 3px 5px;
  background: var(--white);
  cursor: pointer;
  transition: background .1s;
  position: relative;
  min-width: 0;
  overflow: hidden;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:hover { background: var(--gold-pale); }
.cal-cell.other-mo { background: #FAFAF8; }
.cal-cell.today { background: #FEF9EC; }
.day-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-lt);
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 3px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cal-cell.today .day-num { background: var(--crimson); color: #fff; }
.cal-cell.other-mo .day-num { color: var(--border-dk); }

/* Event chips — colour set inline per event */
.chip {
  border-radius: 3px;
  padding: 3px 5px;
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 3px;
  cursor: pointer;
  white-space: normal;
  word-break: break-word;
  overflow: visible;
  line-height: 1.45;
  border-left: 3px solid transparent;
  transition: filter .12s;
  display: flex;
  align-items: flex-start;
  gap: 5px;
  width: 100%;
  box-sizing: border-box;
}
.chip:hover { filter: brightness(.87); }
.chip-holiday { background: #EEE6FA !important; color: #5B2D8E !important; border-color: #7C3AED !important; font-style: italic; font-weight: 600; }
.chip-cancelled { text-decoration: line-through; opacity: .75; }
.chip-bump { border-left-style: dashed !important; opacity: .85; font-style: italic; }

/* -- Legend -- */
.legend {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 9px 14px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  font-size: 11.5px;
}
.leg-item { display: flex; align-items: center; gap: 5px; color: var(--ink-md); }
.leg-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.lg-confirmed { background: var(--confirmed); }
.lg-suggested { background: var(--suggested); }
.lg-complete  { background: var(--complete); }
.lg-cancelled { background: var(--cancelled); }
.lg-bump      { background: var(--bump-color); opacity: .5; }
.lg-holiday   { background: #7C3AED; }
.leg-sep { width: 1px; height: 14px; background: var(--border); }

/* -- Filter bar -- */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-lbl { font-size: 11.5px; color: var(--ink-lt); font-weight: 500; }
.filter-sel {
  border: 1px solid var(--border);
  background: var(--white);
  border-radius: var(--r);
  padding: 5px 9px;
  font-size: 12px;
  color: var(--ink);
  outline: none;
  cursor: pointer;
  font-family: inherit;
  transition: border-color .13s;
}
.filter-sel:focus { border-color: var(--gold); }
.filter-input {
  border: 1px solid var(--border);
  background: var(--white);
  border-radius: var(--r);
  padding: 5px 9px;
  font-size: 12px;
  color: var(--ink);
  outline: none;
  font-family: inherit;
  min-width: 120px;
}
.filter-input:focus { border-color: var(--gold); }

/* -- List table -- */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: left;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-lt);
  font-weight: 600;
  padding: 9px 12px;
  background: var(--sand);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.tbl th:hover { color: var(--ink); }
.tbl td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--ink);
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--gold-pale); }

/* -- Status badge -- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.bd-confirmed { background: var(--confirmed-bg); color: #7B5B0A; }
.bd-suggested { background: var(--suggested-bg); color: #17438A; }
.bd-complete  { background: var(--complete-bg);  color: #145532; }
.bd-cancelled { background: var(--cancelled-bg); color: #8B1230; }
.bd-wo        { background: #FFF0F6; color: #9C1B6E; font-size: 10px; padding: 1px 6px; }
.bd-intl      { background: var(--sand); color: var(--ink-lt); font-size: 10px; padding: 1px 6px; }

/* -- Modal / overlay -- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(28,26,24,.42);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--white);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.modal-hd {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 1;
}
.modal-title { font-family: 'El Messiri', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
.modal-body  { padding: 20px; flex: 1; }
.modal-ft {
  padding: 13px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  position: sticky;
  bottom: 0;
  background: var(--white);
}
.x-btn {
  width: 28px; height: 28px;
  border: none;
  background: var(--sand);
  border-radius: 6px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: var(--ink-md);
  transition: background .12s;
}
.x-btn:hover { background: var(--border); }

/* -- Form -- */
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg-label { font-size: 11.5px; font-weight: 600; color: var(--ink-md); }
.fg-label .req { color: var(--cancelled); margin-left: 2px; }
.fg-input, .fg-select, .fg-ta {
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 7px 10px;
  font-size: 13px;
  color: var(--ink);
  outline: none;
  background: var(--white);
  font-family: inherit;
  transition: border-color .13s;
}
.fg-input:focus, .fg-select:focus, .fg-ta:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(133,117,78,.1); }
.fg-ta { resize: vertical; min-height: 68px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.form-full { grid-column: 1/-1; }
.form-sep { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-lt); padding-bottom: 6px; border-bottom: 1px solid var(--border); grid-column: 1/-1; margin-top: 4px; }
.chk-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; }
.chk-row input { width: 14px; height: 14px; accent-color: var(--crimson); cursor: pointer; }

/* -- Conflict banner -- */
.conflict-banner {
  background: var(--cancelled-bg);
  border: 1px solid #FCA5A5;
  border-radius: var(--r);
  padding: 9px 12px;
  font-size: 12px;
  color: var(--cancelled);
  margin-bottom: 14px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

/* -- Drawer -- */
.drawer {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 370px;
  background: var(--white);
  box-shadow: -4px 0 24px rgba(28,26,24,.13);
  z-index: 150;
  display: flex;
  flex-direction: column;
}
.drawer-hd {
  padding: 16px 18px 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.drawer-title { font-family: 'El Messiri', serif; font-size: 15px; font-weight: 700; color: var(--ink); flex: 1; line-height: 1.3; }
.drawer-body  { padding: 16px 18px; flex: 1; overflow-y: auto; }
.dr-row { display: flex; gap: 8px; margin-bottom: 11px; align-items: flex-start; }
.dr-ico { color: var(--ink-lt); flex-shrink: 0; margin-top: 1px; }
.dr-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-lt); margin-bottom: 2px; }
.dr-val { font-size: 13px; color: var(--ink); }
.hist-entry { font-size: 11.5px; color: var(--ink-md); padding: 8px 0; border-bottom: 1px solid var(--border); }
.hist-entry:last-child { border-bottom: none; }
.hist-time { font-size: 10.5px; color: var(--ink-lt); margin-top: 2px; }

/* -- Tabs -- */
.tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 14px; }
.tab { padding: 7px 14px; font-size: 12.5px; font-weight: 500; color: var(--ink-lt); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .13s; }
.tab.active { color: var(--crimson); border-bottom-color: var(--crimson); }

/* -- CSV Import -- */
.dropzone {
  border: 2px dashed var(--border-dk);
  border-radius: var(--r);
  padding: 40px 24px;
  text-align: center;
  cursor: pointer;
  transition: all .18s;
  background: var(--sand);
}
.dropzone:hover { border-color: var(--gold); background: var(--gold-pale); }
.dropzone-icon { font-size: 30px; margin-bottom: 10px; }
.dropzone-txt { font-size: 14px; font-weight: 500; color: var(--ink); }
.dropzone-sub { font-size: 12px; color: var(--ink-lt); margin-top: 4px; }
.import-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 4px; }
.import-ok   { background: var(--complete-bg);   color: var(--complete); }
.import-warn { background: #FFFBEB; color: #92400E; }
.import-err  { background: var(--cancelled-bg);  color: var(--cancelled); }

/* -- Toasts -- */
.toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
.toast {
  background: var(--ink);
  color: #fff;
  padding: 9px 15px;
  border-radius: var(--r);
  font-size: 12.5px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: toastIn .18s ease;
  max-width: 300px;
}
.toast.success { background: var(--complete); }
.toast.error   { background: var(--cancelled); }
.toast.warning { background: var(--gold); }
@keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* -- Holiday cards -- */
.hol-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 11px 15px;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 13px;
  box-shadow: var(--shadow-sm);
}
.hol-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.hol-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.hol-date { font-size: 11.5px; color: var(--ink-lt); margin-top: 2px; }

/* -- Empty state -- */
.empty { text-align: center; padding: 50px 20px; color: var(--ink-lt); }
.empty-ico { font-size: 38px; margin-bottom: 12px; }
.empty-ttl { font-size: 15px; font-weight: 600; color: var(--ink-md); margin-bottom: 5px; }
.empty-sub { font-size: 12.5px; }

/* -- Role badges -- */
.role-badge { display: inline-flex; padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.role-admin  { background: #FEF3C7; color: #92400E; }
.role-editor { background: var(--suggested-bg); color: #17438A; }
.role-viewer { background: var(--sand); color: var(--ink-lt); }

/* -- Misc -- */
.two-col   { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.note { font-size: 11px; color: var(--ink-lt); margin-top: 6px; }
.share-url { background: var(--sand); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 11px; font-size: 11.5px; color: var(--ink-md); word-break: break-all; font-family: monospace; margin-bottom: 10px; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-dk); border-radius: 3px; }

/* -- Tooltip -- */
.tooltip-wrap { position: relative; display: inline-block; }
.tooltip-wrap .tooltip-box {
  visibility: hidden; opacity: 0;
  position: fixed;
  background: var(--ink); color: #fff;
  font-size: 12px; font-weight: 500; white-space: nowrap;
  padding: 5px 10px; border-radius: 5px;
  pointer-events: none;
  transition: opacity .15s;
  z-index: 99999;
  transform: translateX(-50%) translateY(-100%) translateY(-8px);
}
.tooltip-wrap:hover .tooltip-box { visibility: visible; opacity: 1; }

@media (max-width: 860px) {
  .sidebar { display: none; }
  .dash-stats { grid-template-columns: repeat(2,1fr); }
  .form-grid { grid-template-columns: 1fr; }
}

/* -- Tutorial page -- */
.tut-hero {
  background: var(--crimson);
  border-radius: var(--r);
  padding: 28px 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.tut-hero::after {
  content: '';
  position: absolute;
  right: -30px; top: -40px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(133,117,78,.18);
}
.tut-hero-title { font-family: 'El Messiri',serif; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.tut-hero-sub { font-size: 13px; color: rgba(255,255,255,.7); max-width: 480px; }
.tut-tabs { display: flex; gap: 0; background: var(--white); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 20px; }
.tut-tab { flex: 1; padding: 11px 16px; text-align: center; font-size: 13px; font-weight: 500; color: var(--ink-lt); cursor: pointer; transition: all .13s; border: none; background: none; font-family: inherit; }
.tut-tab.active { background: var(--crimson); color: #fff; }
.tut-tab:hover:not(.active) { background: var(--sand); color: var(--ink); }
.tut-section { margin-bottom: 28px; }
.tut-section-title { font-family: 'El Messiri',serif; font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.tut-steps { display: flex; flex-direction: column; gap: 0; }
.tut-step {
  display: flex;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.tut-step:last-child { border-bottom: none; }
.tut-step-num {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--crimson);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  font-family: 'El Messiri', serif;
}
.tut-step-body { flex: 1; }
.tut-step-title { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.tut-step-desc { font-size: 12.5px; color: var(--ink-md); line-height: 1.6; }
.tut-step-tip { font-size: 11.5px; color: var(--gold); margin-top: 6px; display: flex; align-items: center; gap: 5px; font-weight: 500; }
.tut-code {
  display: inline-block;
  background: var(--ink);
  color: #F3EFE3;
  font-family: monospace;
  font-size: 11.5px;
  padding: 2px 8px;
  border-radius: 4px;
  margin: 2px 2px;
}
.tut-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--sand);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-md);
  margin: 2px;
}
.tut-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.tut-field {
  background: var(--sand);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
}
.tut-field-name { font-size: 12px; font-weight: 600; color: var(--ink); }
.tut-field-desc { font-size: 11px; color: var(--ink-lt); margin-top: 2px; }
.tut-field.required .tut-field-name::after { content: ' *'; color: var(--cancelled); }
.tut-callout {
  background: var(--gold-pale);
  border: 1px solid var(--gold);
  border-left: 3px solid var(--gold);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12.5px;
  color: var(--ink-md);
  margin: 12px 0;
  line-height: 1.6;
}
.tut-callout strong { color: var(--ink); }
.tut-valid-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 10px; }
.tut-valid-box { background: var(--sand); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.tut-valid-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-lt); margin-bottom: 7px; }
.tut-valid-item { font-family: monospace; font-size: 11px; color: var(--ink); background: var(--white); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; margin: 2px 2px 2px 0; display: inline-block; }
</style>

/* Deterministic event colour (same palette as app) */
function printEvColor(id){
  const PAL=[
    {bg:'#F5E8EC',border:'#901938',text:'#5A0F24'},
    {bg:'#F5F0E3',border:'#857549',text:'#4A3E1A'},
    {bg:'#F2EDE5',border:'#A07850',text:'#5A3E20'},
    {bg:'#EEECEA',border:'#7A706A',text:'#3A3430'},
    {bg:'#E8E8E8',border:'#2C2C2C',text:'#1A1A1A'},
    {bg:'#EDE0E4',border:'#6E1229',text:'#3A0814'},
    {bg:'#FAF5E8',border:'#C4972A',text:'#6A4E00'},
    {bg:'#EDE8E0',border:'#8C7B60',text:'#4A3C28'},
    {bg:'#E5E5E5',border:'#555050',text:'#282424'},
    {bg:'#F0E5E8',border:'#B04060',text:'#6A1830'},
    {bg:'#F0EAE0',border:'#9A7040',text:'#52360A'},
    {bg:'#EAEAEA',border:'#404040',text:'#1C1C1C'},
  ];
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))&0xFFFFFF;
  return PAL[Math.abs(h)%PAL.length];
}

/* -- Shared print header HTML -- */
function printHeader(label){
  const now=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  return `
  <div class="ph">
    <div class="ph-logo">${LOGO_IMG_TAG}</div>
    <div class="ph-mid">
      <div class="ph-sub">EVENTS MASTER CALENDAR</div>
      <div class="ph-title">${label}</div>
    </div>
    <div class="ph-right">Exported ${now}</div>
  </div>
  <div class="ph-gold-line"></div>`;
}

/* -- Shared print CSS -- */
const PRINT_BASE_CSS=`
  @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;font-size:10pt;color:#1C1A18;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:0;size:A4 landscape}
  /* Print header */
  .ph{background:#901938;display:flex;align-items:center;padding:8px 14px;gap:16px;min-height:34px}
  .ph-logo svg{width:100px;height:auto;display:block}
  .ph-mid{flex:1}
  .ph-sub{font-size:6pt;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:2px}

`;

  const rows=ev.map((e,i)=>{
    const s=(()=>{if(e.cancelled||e.status==='Cancelled')return'Cancelled';if(e.status==='Suggested')return'Suggested';const t=new Date().toISOString().slice(0,10);if(e.endDate&&e.endDate<t)return'Complete';if(!e.endDate&&e.startDate&&e.startDate<t)return'Complete';return e.status||'Confirmed';})();
    const dc=STATUS_DOT_COLOR[s]||'#857549';
    const col=printEvColor(e.id);
    const bg=i%2===0?'#FDFCFA':'#fff';
    const dates=e.startDate?(e.endDate&&e.endDate!==e.startDate?`${fmtDS(e.startDate)} → ${fmtDS(e.endDate)}`:fmtDS(e.startDate)):'—';
    const bump=e.bumpInDate||e.bumpOutDate?`${e.bumpInDate?fmtDS(e.bumpInDate):''}${e.bumpInDate&&e.bumpOutDate?' / ':''}${e.bumpOutDate?fmtDS(e.bumpOutDate):''}`:' — ';
    return `<tr style="background:${bg}">
      <td style="padding:5px 8px">
        <div style="display:flex;align-items:flex-start;gap:6px">
          <span style="width:10px;height:10px;border-radius:2px;background:${col.border};flex-shrink:0;margin-top:2px;display:inline-block"></span>
          <div>
            <div style="font-weight:600;font-size:8.5pt">${e.name||''}</div>
            ${e.notes?`<div style="font-size:6.5pt;color:#8C7B60;margin-top:1px">${e.notes.slice(0,60)}</div>`:''}
          </div>
        </div>

/* =
   CALENDAR VIEW EXPORT — one month per page
   = */
function printCalendarHTML(ev, holidays, dateRangeLabel, fromDate, toDate){
  // Determine months
  const months=[];
  if(fromDate&&toDate){
    let d=new Date(fromDate+'T00:00:00');
    const end=new Date(toDate+'T00:00:00');
    while(d<=end){months.push({y:d.getFullYear(),m:d.getMonth()});d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  } else {
    const mSet=new Set(ev.map(e=>e.startDate?.slice(0,7)).filter(Boolean));
    [...mSet].sort().forEach(ym=>{const[yr,mo]=ym.split('-').map(Number);months.push({y:yr,m:mo-1});});
  }
  if(!months.length) months.push({y:new Date().getFullYear(),m:new Date().getMonth()});

  const todayStr=new Date().toISOString().slice(0,10);

  const getStatus=e=>{if(e.cancelled||e.status==='Cancelled')return'Cancelled';if(e.status==='Suggested')return'Suggested';const t=todayStr;if(e.endDate&&e.endDate<t)return'Complete';if(!e.endDate&&e.startDate&&e.startDate<t)return'Complete';return e.status||'Confirmed';};

  const monthPages=months.map(mo=>{
    const firstDay=new Date(mo.y,mo.m,1).getDay();
    const daysInMo=new Date(mo.y,mo.m+1,0).getDate();
    const prevDays=new Date(mo.y,mo.m,0).getDate();
    const cells=[];
    // Leading empty cells
    for(let i=0;i<firstDay;i++) cells.push({other:true,n:prevDays-firstDay+i+1,ds:null});
    // This month
    for(let d=1;d<=daysInMo;d++){
      const ds=`${mo.y}-${String(mo.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({other:false,n:d,ds});
    }
    // Trailing
    while(cells.length<42) cells.push({other:true,n:cells.length-firstDay-daysInMo+1,ds:null});

    // Group cells into week rows (7 per row) — a <table> paginates properly
    // in print; CSS Grid does not reliably break across pages and silently
    // clips overflow instead of flowing it to a new page.
    const weekRowsHTML=[];
    for(let i=0;i<cells.length;i+=7) weekRowsHTML.push(cells.slice(i,i+7));
    const weeksHTML=weekRowsHTML.map(week=>{
      const tds=week.map(cell=>{
        if(cell.other) return `<td class="cal-cell other-mo"><div class="cal-cell-inner"><div class="dn" style="color:#D4CCBF">${cell.n}</div></div></td>`;
        const isToday=cell.ds===todayStr;
        const dayHols=holidays.filter(h=>h.date<=cell.ds&&(h.endDate||h.date)>=cell.ds);
        const dayEv=ev.filter(e=>e.startDate<=cell.ds&&(e.endDate||e.startDate)>=cell.ds);
        const bumps=[];
        ev.forEach(e=>{
          if(!e.bumpInDate&&!e.bumpOutDate)return;
          const s=e.startDate,en=e.endDate||e.startDate;
          if(s<=cell.ds&&cell.ds<=en)return;
          if(e.bumpInDate&&cell.ds>=e.bumpInDate&&cell.ds<s)bumps.push({...e,_bt:'in'});
          else if(e.bumpOutDate&&cell.ds>en&&cell.ds<=e.bumpOutDate)bumps.push({...e,_bt:'out'});
        });
        const holChips=dayHols.map(h=>`<div class="chip hol-chip">${h.name}</div>`).join('');
        const evChips=dayEv.map(e=>{
          const s=getStatus(e);
          const dc=STATUS_DOT_COLOR[s]||'#857549';
          const col=printEvColor(e.id);
          const isCan=s==='Cancelled';
          return `<div class="chip ev-chip" style="background:${col.bg};border-left:3px solid ${col.border};color:${col.text};${isCan?'opacity:.6;text-decoration:line-through':''}">
            <span class="sdot" style="background:${dc}"></span>
            <span class="ename">${e.womensOnly?'👩 ':''}${e.location?`[${e.location}] `:''}${e.name}</span>
          </div>`;
        }).join('');
        const bumpChips=bumps.map(e=>{
          const col=printEvColor(e.id);
          const dc=STATUS_DOT_COLOR[getStatus(e)]||'#857549';
          const lbl=e._bt==='in'?'↓ Bump-In':'↑ Bump-Out';
          return `<div class="chip ev-chip bump-chip" style="background:${col.bg};border-left:3px dashed ${col.border};color:${col.text}">
            <span class="sdot" style="background:${dc};opacity:.7"></span>
            <span class="ename">${lbl}: ${e.name}</span>
          </div>`;
        }).join('');
        return `<td class="cal-cell${isToday?' today':''}"><div class="cal-cell-inner">
          <div class="dn${isToday?' today-dn':''}">${cell.n}</div>
          ${holChips}${evChips}${bumpChips}
        </div></td>`;
      }).join('');
      return `<tr class="cal-week-row">${tds}</tr>`;
    }).join('');

    return `<div class="month-page">
      ${printHeader(`${MONTHS_FULL[mo.m]} ${mo.y}`)}
      <div class="legend-row">
        ${Object.entries(STATUS_DOT_COLOR).map(([k,c])=>`<div class="leg"><span class="leg-dot" style="background:${c}"></span>${k}</div>`).join('')}
        <span style="margin-left:6px;font-size:7pt;color:#8C7B60;font-style:italic">● = Status dot · Block colour = unique per event</span>
      </div>
      <table class="cal-wrap">
        <thead>
          <tr class="cal-hdr-row">${DAYS_FULL.map(d=>`<th class="cal-hdr-cell">${d}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${weeksHTML}
        </tbody>
      </table>
      <div class="pf"><span>Al Shaqab — Internal Document — Confidential</span><span>${ev.length} event${ev.length!==1?'s':''}</span></div>
    </div>`;
  }).join('');

  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Al Shaqab Events — Calendar View\u003C/title>
  <style>
    ${PRINT_BASE_CSS}
    @page{size:A4 landscape;margin:0}
    .month-page{page-break-after:always;display:block;}
    .month-page:last-child{page-break-after:avoid}
    /* Calendar grid — a <table> so weeks paginate properly in print.
       CSS Grid does not reliably fragment across page breaks and silently
       clips overflow rows instead of flowing them to a new page. */
    .cal-wrap{width:100%;border-collapse:collapse;table-layout:fixed;}
    .cal-hdr-row{background:#901938;}
    .cal-hdr-cell{padding:4px 6px;text-align:center;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.85);background:#901938;border:none;}
    .cal-week-row{break-inside:avoid;page-break-inside:avoid;}
    .cal-cell{border-right:1px solid #E6E0D6;border-bottom:1px solid #E6E0D6;padding:3px;background:#fff;vertical-align:top;min-height:80px;}
    .cal-cell-inner{display:flex;flex-direction:column;min-height:74px;}
    .cal-cell:last-child{border-right:none}
    .cal-cell.other-mo{background:#FAFAF8}
    .cal-cell.today{background:#FEF9EC}
    /* Day number */
    .dn{font-size:9pt;font-weight:700;color:#7A7060;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;margin-bottom:2px}
    .today-dn{background:#901938;color:#fff}
    /* Chips */
    .chip{border-radius:3px;padding:1.5px 3px;font-size:6pt;margin-bottom:1.5px;line-height:1.35;display:flex;align-items:flex-start;gap:2px;width:100%;border-left:2px solid transparent}
    .ev-chip{}
    .bump-chip{opacity:.85;font-style:italic}
    .hol-chip{background:#EEE6FA;color:#5B2D8E;border-color:#7C3AED;font-style:italic;font-weight:600}
    .sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:2px;display:inline-block}
    .ename{flex:1;word-break:break-word;overflow:hidden;}
    /* Compact variant — applied only to months whose natural height
       overflows one printed page (see openPrintWindow's measurement pass) */
    .month-page.compact .cal-hdr-cell{font-size:6.5pt}
    .month-page.compact .cal-cell{min-height:58px}
    .month-page.compact .cal-cell-inner{min-height:52px}
    .month-page.compact .dn{font-size:8pt}
    .month-page.compact .chip{font-size:5pt}
  \u003C/style>
  \u003C/head><body>${monthPages}\u003C/body>\u003C/html>`;
}

/* -- Open print window -- */
function openPrintWindow(html, filename){
  const w=window.open('','_blank','width=1100,height=800');
  if(!w){alert('Please allow popups for this site to use the export feature.');return;}
  w.document.open();
  w.document.write(html);
  w.document.close();
  // One A4-landscape page, interior height in CSS reference px (96px/in, margin:0).
  const PAGE_H=790;
  const fitMonthPages=()=>{
    try{
      w.document.querySelectorAll('.month-page').forEach(mp=>{
        if(mp.offsetHeight>PAGE_H) mp.classList.add('compact');
      });
    }catch(e){}
  };
  // Wait for fonts/images to load, shrink only the months that overflow a page, then print
  w.onload=()=>{ setTimeout(()=>{ fitMonthPages(); w.focus(); w.print(); },800); };
  // Fallback
  setTimeout(()=>{ try{fitMonthPages();w.focus();w.print();}catch(e){} },1500);
}

  // would introduce in any timezone ahead of UTC (e.g. Qatar, UTC+3).
  const [y, mo, day] = d.split('-').map(Number);

  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;

function isValidCalendarDate(y, mo, d) {
  const dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
}
function isValidISODate(raw) {
  if (!raw) return true;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw.trim());
  if (!m) return false;
  return isValidCalendarDate(+m[1], +m[2], +m[3]);
}
// Accepts ISO (YYYY-MM-DD) as-is. Otherwise tries D/M/Y or D-M-Y (the
// regional convention used in our CSV templates and Excel's default in
// most non-US locales). If one slot can only be a day (>12) the other is
// taken as the month; if both are ambiguous (<=12) D/M/Y wins. Returns
// '' for a blank input, or null if the value can't be parsed as a date.
function parseFlexibleDate(raw) {
  if (!raw) return '';
  const s = raw.trim();
  if (isValidISODate(s)) return s;
  const m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(s);
  if (!m) return null;
  let day = +m[1],
    month = +m[2];
  const year = +m[3];
  if (day > 12 && month > 12) return null;
  if (month > 12) {
    [day, month] = [month, day];
  }
  if (!isValidCalendarDate(year, month, day)) return null;
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}
function dateRange(s, end) {
  const days = [];

    days.push(d.toISOString().slice(0, 10));

  }
  return days;
}

  return ev.status || 'Confirmed';
}
function detectConflicts(events, ev) {
  if (!ev.location || !ev.startDate) return [];

/* Status dot colour \u2014 communicates event status independent of chip colour */
const STATUS_DOT = {
  Confirmed: '#C4972A',
  /* Gold */
  Suggested: '#2563A8',
  /* Blue */
  Complete: '#1F7A4A',
  /* Green */
  Cancelled: '#B91C3B' /* Red */
};

/* Assign a palette index to each event id deterministically */
function evColor(id, cancelled) {
  if (cancelled) return {
    bg: '#F0E5E5',
    border: '#8C3030',
    text: '#5A1010'
  };
  let h = 0;
  for (let i = 0; i < id.length; i++) h = h * 31 + id.charCodeAt(i) & 0xFFFFFF;
  return EV_PALETTE[Math.abs(h) % EV_PALETTE.length];
}
